# Publishes spiral-trust to PyPI when a GitHub Release is published, using PyPI Trusted Publishing
# (OIDC): no API token is stored. Owner-only one-time step: add this repository, this workflow
# file name and the environment name "pypi" as a trusted publisher on pypi.org (see PUBLISHING.md).
name: publish-pypi
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Release tag must match the Python package version
        run: |
          pkg="$(python -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")"
          if [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match python/pyproject.toml version $pkg" >&2
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m unittest discover -s python/tests -v
      - run: python -m build python
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
