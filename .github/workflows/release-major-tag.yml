# Keeps the moving major tag (v1, v2 ...) pointed at the latest release, so that
# `uses: reimsfreitas-alt/spiral-trust-scan@v1` follows new releases. Runs on release published.
name: release-major-tag
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  tag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the major tag
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag $tag is not vMAJOR.MINOR.PATCH; not moving a major tag."
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
