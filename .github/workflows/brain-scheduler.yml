name: brain-scheduler

# Free external trigger for the Spiral super-brain (replaces the native */5 Vercel cron,
# which Vercel Hobby does not allow). Runs ONLY if the BRAIN_CRON_SECRET repo secret is set;
# otherwise it exits cleanly without calling anything.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: brain-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BRAIN_URL: https://spiral-super-brain.vercel.app/api/autonomous-cycle
      BRAIN_CRON_SECRET: ${{ secrets.BRAIN_CRON_SECRET }}
    steps:
      - name: Trigger autonomous cycle
        run: |
          if [ -z "$BRAIN_CRON_SECRET" ]; then
            echo "BRAIN_CRON_SECRET not set; skipping (scheduler inert)."
            exit 0
          fi
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${BRAIN_CRON_SECRET}" \
            --max-time 60 "$BRAIN_URL")
          echo "HTTP $code"
          cat body.json
          # 200 = cycle ran; anything else is surfaced as a failed run (no fake success)
          [ "$code" = "200" ]
